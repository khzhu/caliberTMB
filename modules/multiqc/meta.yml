name: multiqc
description: Aggregate quality control metrics from Samtools, Picard, and FastQC for all samples 
  in the cohort into a single report.
keywords:
  - Per-sample quality metrics
  - Mapping rates
  - Read duplication levels
  - Quantification summaries
tools:
  - multiqc:
      description: |
        MultiQC searches a given directory for analysis logs and compiles a HTML report.
        It's a general use tool, perfect for summarising the output from numerous bioinformatics tools.
      homepage: https://multiqc.info/
      documentation: https://multiqc.info/docs/
      licence: ["GPL-3.0-or-later"]
      identifier: biotools:multiqc
input:
  - - multiqc_path:
        type: file
        description: |
          List of reports and files generated by Samtools, Picard, and FastQC, such as the HTML and ZIP outputs of FastQC.
output:
  - report:
      - "*multiqc_report.html":
          type: file
          description: MultiQC report file
          pattern: "multiqc_report.html"
  - data:
      - "*_data":
          type: directory
          description: MultiQC data dir
          pattern: "multiqc_data"
  - plots:
      - "*_plots":
          type: file
          description: Plots created by MultiQC
          pattern: "*_data"
  - versions:
      - versions.yml:
          type: file
          description: File containing software versions
          pattern: "versions.yml"
authors:
  - "@abhi18av"
  - "@bunop"
  - "@drpatelh"
  - "@jfy133"
maintainers:
  - "@abhi18av"
  - "@bunop"
  - "@drpatelh"
  - "@jfy133"